          shutil.copyfile(master,root/('Turbo164_Pilot_Leads_'+stamp+'.csv'))
          shutil.copyfile(root/'cumulative-master.csv',root/('Turbo164_Master_Catalog_'+stamp+'.csv'))
          (root/'coverage.json').write_text(json.dumps({'time':now,'pilot_only':True,'version':'6.1','new_leads':len(rows)-initial_lead_count,'historical_master_present':historical.exists(),'cumulative_count':len(combined),'review_candidates':len(review),'elapsed_research_seconds':round(time.monotonic()-started),'catalog_count':len(catalog),'lead_count':len(rows),'sources':log,'publication':'pending separate publication step; see publication-result.json'},indent=2))
          print(json.dumps(log))
