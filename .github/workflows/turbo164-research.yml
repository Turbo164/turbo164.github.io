name: Turbo164 research V6.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/turbo164-research.yml'
  schedule:
    - cron: '0 0-23/2 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: turbo164-research-pilot
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded research programs
        run: |
          python - <<'PY'
          import pathlib, re
          source=pathlib.Path('.github/workflows/turbo164-research.yml').read_text()
          blocks=re.findall(r"^          python - <<'PY'\n(.*?)^          PY$",source,re.M|re.S)
          assert len(blocks)>=3, 'Missing embedded programs'
          for i,block in enumerate(blocks):
            compile('\n'.join(line[10:] for line in block.splitlines()),f'workflow-program-{i}','exec')
          print('Embedded Python syntax checks passed')
          PY
      - name: Recover durable research state
        run: |
          mkdir -p research
          if git fetch origin refs/heads/turbo164-research-state:refs/remotes/origin/turbo164-research-state; then
            git archive FETCH_HEAD research | tar -x
          fi
      - name: Recover previous pilot state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research
          run=$(gh run list --workflow turbo164-research.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ ! -s research/cumulative-master.csv ] && [ -n "$run" ]; then gh run download "$run" -n turbo164-research -D research; fi
      - name: Import historical checkpoint if supplied
        run: |
          mkdir -p research-master
          if [ -f research-master/historical.csv ]; then
            echo 'Historical checkpoint present'
          else
            echo 'Historical checkpoint missing; preserving recovered pilot history only'
          fi
      - name: Collect research leads
        run: |
          python - <<'PY'
          import csv, json, time, pathlib, urllib.request, urllib.parse, urllib.robotparser, datetime, hashlib
          from zoneinfo import ZoneInfo
          root=pathlib.Path('research')
          statefile=root/'state.json'
          state=json.loads(statefile.read_text()) if statefile.exists() else {}
          master=root/'pilot-leads.csv'
          cols=['Check Date (Bangkok)','Manufacturer','Product Code','Car Make','Model Name','Color/Variant','Edition Type','Release Status','Photo URL','Photo Source URL','Image Status','Source URL','GitHub Status','Verification','Notes','GitHub Model ID','First Seen Date','Last Checked Date']
          rows=list(csv.DictReader(master.open())) if master.exists() else []
          now=datetime.datetime.now(ZoneInfo('Asia/Bangkok')).isoformat()
          started=time.monotonic()
          deadline=started+53*60
          ua='Turbo164Research/1.0 (+https://turbo164.github.io/)'
          initial_lead_count=len(rows)
          import socket
          socket.setdefaulttimeout(20)
          robots_cache={}
          def retry_due(record,hours):
            if not record: return True
            try:
              return (datetime.datetime.fromisoformat(now)-datetime.datetime.fromisoformat(record['checked'])).total_seconds()>=hours*3600
            except (KeyError,TypeError,ValueError):
              return True
          def search_due(record):
            return not record or (bool(record.get('error')) and retry_due(record,12)) or (not record.get('hits') and retry_due(record,168))
          def evidence_due(record):
            return not record or (bool(record.get('error')) and retry_due(record,12))
          catalog=json.loads(pathlib.Path('catalog.json').read_text())
          codes={(str(x.get('manufacturer','')).casefold(),str(x.get('productCode','')).casefold()) for x in catalog if x.get('productCode')}
          seen={(r['Manufacturer'],r['Source URL'],r['Product Code'],r['Color/Variant']) for r in rows}
          sources=[
            ('Tarmac Works','https://www.tarmacworks.com/collections/1-64-scale'),
            ('Hobby Japan','https://www.modelcarshouston.com/collections/hobby-japan-minicar-project'),
            ('Johnny Lightning','https://www.autoworldstore.com/collections/johnny-lightning-1-64-scale'),
            ('Auto World','https://www.autoworldstore.com/collections/auto-world-1-64-scale'),
            ('PGM','https://www.modelcarshouston.com/collections/pgm'),
            ('MINI GT','https://www.modelcarshouston.com/collections/mini-gt'),
            ('INNO64','https://www.modelcarshouston.com/collections/inno64'),
            ('POP RACE','https://www.modelcarshouston.com/collections/pop-race'),
            ('Kaido House','https://www.modelcarshouston.com/collections/kaido-house'),
            ('Ignition Model','https://www.modelcarshouston.com/collections/ignition-model'),
            ('GreenLight','https://www.modelcarshouston.com/collections/greenlight'),
            ('M2 Machines','https://www.modelcarshouston.com/collections/m2-machines')]
          log=[]
          def fetch(url):
            if time.monotonic()>=deadline: raise RuntimeError('research deadline reached')
            p=urllib.parse.urlsplit(url)
            url=urllib.parse.urlunsplit((p.scheme,p.netloc,urllib.parse.quote(p.path,safe="/%:@!$&'()*+,;=-._~"),urllib.parse.quote(p.query,safe='=&%+/:?'),''))
            origin=p.scheme+'://'+p.netloc
            if origin not in robots_cache:
              robots=urllib.robotparser.RobotFileParser(origin+'/robots.txt')
              robots.read()
              robots_cache[origin]=robots
            robots=robots_cache[origin]
            if not robots.can_fetch(ua,url): raise RuntimeError('robots disallows')
            time.sleep(max(2,robots.crawl_delay(ua) or 0))
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=20) as f:
              return f.read(8_000_000)
          def save():
            tmp=master.with_suffix('.tmp')
            with tmp.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(rows)
            tmp.replace(master)
            statefile.write_text(json.dumps(state,indent=2))
          # V5.4: broaden discovery with additional retailer collections.
          # V5.2: rotate collection priority and revisit previously seen pages for changes.
          offset=state.get('collection_rotation',0)%len(sources)
          sources=sources[offset:]+sources[:offset]
          state['collection_rotation']=offset+1
          for brand,base in sources:
            page=state.get(base,1)
            try:
              round_digests=set()
              for _ in range(8):
                if time.monotonic()>min(deadline,started+12*60): break
                url=base+'/products.json?limit=250&page='+str(page)
                products=json.loads(fetch(url))['products']
                if not products:
                  state[base]=1;break
                digest=hashlib.sha256(json.dumps([p.get('id') for p in products]).encode()).hexdigest()
                if digest in round_digests:
                  log.append([brand,'repeated within round; restart next round',page])
                  state[base]=1
                  break
                round_digests.add(digest)
                if digest in state.get(base+' fingerprints',[]):
                  log.append([brand,'repeated page; checking variants for changes',page])
                for p in products:
                  for v in p.get('variants',[]):
                    sku=str(v.get('sku') or '').strip()
                    link=base.split('/collections/')[0]+'/products/'+p['handle']+'?variant='+str(v['id'])
                    key=(brand,link,sku,str(v.get('title','')))
                    if key in seen: continue
                    seen.add(key)
                    row=dict.fromkeys(cols,'')
                    row.update({'Check Date (Bangkok)':now,'Manufacturer':brand,'Product Code':sku,'Model Name':p['title'],'Color/Variant':key[3],'Source URL':link,'Image Status':'MISSING PHOTO','GitHub Status':'POSSIBLE DUPLICATE' if sku and (brand.casefold(),sku.casefold()) in codes else 'NEEDS VERIFICATION','Verification':'NEEDS VERIFICATION','Notes':'Shopify lead only; scale, manufacturer SKU, edition and release require independent verification','First Seen Date':now,'Last Checked Date':now})
                    rows.append(row)
                log.append([brand,'page collected',page,len(products)])
                state[base+' fingerprints']=(state.get(base+' fingerprints',[])+[digest])[-100:]
                page+=1;state[base]=page;save()
            except Exception as e:
              log.append([brand,'blocked',str(e)])
          # Discover links on official archives; never infer SKU or scale from URL.
          from html.parser import HTMLParser
          class Links(HTMLParser):
            def __init__(self):
              super().__init__(); self.links=[]; self.href=None; self.parts=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a': self.href=dict(attrs).get('href'); self.parts=[]
            def handle_data(self,data):
              if self.href: self.parts.append(data)
            def handle_endtag(self,tag):
              if tag=='a' and self.href:
                self.links.append((self.href,' '.join(self.parts).strip())); self.href=None
          archives=[
            ('MINI GT','https://minigt.tsm-models.com/index.php?action=product-list&b_id=13&p='),
            ('INNO64','https://www.inno-models.com/scale/1-64/'),
            ('ARBOX','https://www.armodel.com.cn/product.html?cid=22'),
            ('PGM','https://www.modelcarshouston.com/collections/pgm'),
            ('POP RACE','https://www.poprace.net/'),
            ('Ignition Model','https://ig-model.com/'),
            ('GreenLight','https://www.greenlightcollectibles.com/'),
            ('M2 Machines','https://www.m2machines.com/'),
            ('Kaido House','https://kaidohouse.com/')]
          for brand,base in archives:
            if time.monotonic()>deadline: break
            try:
              page=state.get(brand+' archive page',1)
              url=base+str(page) if brand=='MINI GT' else base
              parser=Links();parser.feed(fetch(url).decode('utf-8','replace'))
              count=0
              for href,title in parser.links:
                link=urllib.parse.urljoin(url,href)
                if not title or urllib.parse.urlsplit(link).netloc!=urllib.parse.urlsplit(url).netloc: continue
                if not any(s in link.lower() for s in ('product/detail','product-detail','product_detail','product-info','product_id=','/products/','/product/','action=product')): continue
                if 'product-list' in link or link==url: continue
                key=(brand,link,'','')
                if key in seen: continue
                seen.add(key);count+=1
                row=dict.fromkeys(cols,'')
                row.update({'Check Date (Bangkok)':now,'Manufacturer':brand,'Model Name':title,'Source URL':link,'Image Status':'MISSING PHOTO','GitHub Status':'NEEDS VERIFICATION','Verification':'NEEDS VERIFICATION','Notes':'Archive link lead; product identity and scale unverified','First Seen Date':now,'Last Checked Date':now})
                rows.append(row)
              if brand=='MINI GT': state[brand+' archive page']=page+1 if count else 1
              log.append([brand,'archive links',count]);save()
            except Exception as e: log.append([brand,'blocked',str(e)])
          # Wiki category discovery with continuation, not official product codes.
          for brand,host in [('Hot Wheels','hotwheels'),('Matchbox','matchbox'),('Tomica','tomica'),('Majorette','majorette')]:
            if time.monotonic()>deadline: break
            try:
              base='https://'+host+'.fandom.com'
              params={'action':'query','list':'categorymembers','cmtitle':'Category:Cars','cmlimit':50,'format':'json'}
              params.update(state.get(brand+' continuation',{}))
              data=json.loads(fetch(base+'/api.php?'+urllib.parse.urlencode(params)))
              count=0
              for item in data['query']['categorymembers']:
                if item.get('ns')!=0: continue
                title=item['title'];link=base+'/wiki/'+urllib.parse.quote(title.replace(' ','_'))
                key=(brand,link,'','')
                if key in seen: continue
                seen.add(key);count+=1
                row=dict.fromkeys(cols,'')
                row.update({'Check Date (Bangkok)':now,'Manufacturer':brand,'Model Name':title,'Source URL':link,'Image Status':'MISSING PHOTO','GitHub Status':'NEEDS VERIFICATION','Verification':'NEEDS VERIFICATION','Notes':'Wiki lead only; exact scale, SKU and variant unverified','First Seen Date':now,'Last Checked Date':now})
                rows.append(row)
              state[brand+' continuation']=data.get('continue',{})
              log.append([brand,'wiki leads',count]);save()
            except Exception as e: log.append([brand,'blocked',str(e)])
          # V6.1: independent historical and mixed-brand discovery, no publication on listing evidence.
          import re
          def add_archive_lead(brand,title,link,note):
            title=' '.join(title.split()).strip()
            if not title or len(title)>350: return False
            key=(brand,link,'','')
            if key in seen: return False
            seen.add(key)
            row=dict.fromkeys(cols,'')
            row.update({'Check Date (Bangkok)':now,'Manufacturer':brand,'Model Name':title,'Source URL':link,'Image Status':'MISSING PHOTO','GitHub Status':'NEEDS VERIFICATION','Verification':'NEEDS VERIFICATION','Notes':note,'First Seen Date':now,'Last Checked Date':now})
            rows.append(row)
            return True
          def listing_links(url):
            parser=Links()
            parser.feed(fetch(url).decode('utf-8','replace'))
            return [(urllib.parse.urljoin(url,h), ' '.join(t.split())) for h,t in parser.links if h]
          def wholesale_brand(title):
            m=re.search(r'\b1\s*[:/]\s*64\b.*?\b(?:diecast|model car|model truck|scale model)\b.*?\bby\s+([^|]{2,65})$',title,re.I)
            if not m: return ''
            brand=m.group(1).strip(' .')
            aliases={'mini gt':'MINI GT','mini gt tsm':'MINI GT','inno models':'INNO64','inno64':'INNO64','tarmac works':'Tarmac Works','greenlight':'GreenLight','m2 machines':'M2 Machines','johnny lightning':'Johnny Lightning','auto world':'Auto World'}
            return aliases.get(brand.casefold(),brand)
          extra_deadline=min(deadline-300,time.monotonic()+8*60)
          # Each source gets an independent durable page cursor. No year cutoff.
          extra_sources=[
            ('wholesale','https://www.diecastmodelswholesale.com/1-64/'),
            ('hobbysearch','https://www.1999.co.jp/eng/search')]
          for kind,base in extra_sources:
            page=max(1,int(state.get('v61 extra '+kind,1)))
            try:
              for _ in range(3):
                if time.monotonic()>=extra_deadline: break
                if kind=='wholesale':
                  url=base+'?page='+str(page)
                else:
                  url=base+'?'+urllib.parse.urlencode({'cat':'mini','searchkey':'1/64','sold':'0','sortid':'0','spage':page,'state':'','target':'','typ1_c':'106'})
                candidates={}
                for link,title in listing_links(url):
                  p=urllib.parse.urlsplit(link)
                  if p.scheme!='https' or p.hostname!=urllib.parse.urlsplit(base).hostname: continue
                  link=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,'',''))
                  if kind=='wholesale':
                    brand=wholesale_brand(title)
                    if not brand or p.path.count('/')!=2 or p.path=='/1-64/': continue
                  else:
                    if not re.fullmatch(r'/eng/\d{7,10}/?',p.path): continue
                    if not title or not re.search(r'diecast car',title,re.I): continue
                    brand='Unknown manufacturer'
                  if len(title)>len(candidates.get(link,('',''))[1]): candidates[link]=(brand,title)
                digest=hashlib.sha256(json.dumps(sorted(candidates)).encode()).hexdigest()
                if not candidates:
                  log.append([kind,'no parseable product links',page])
                  state['v61 extra '+kind]=1
                  break
                if digest==state.get('v61 extra last '+kind) and page>1:
                  log.append([kind,'repeated listing; reset cursor',page])
                  state['v61 extra '+kind]=1
                  break
                count=sum(add_archive_lead(b,t,l,'Independent 1:64 retailer listing lead; manufacturer, SKU, exact variant and release require confirmation') for l,(b,t) in candidates.items())
                log.append([kind,'new listing leads',page,count,'product links',len(candidates)])
                state['v61 extra last '+kind]=digest
                page+=1
                state['v61 extra '+kind]=page
                save()
            except Exception as e:
              log.append([kind,'blocked',str(e)])
          # Historical casting/series index; linked casting pages are leads, not individual variants.
          history_index='https://southtexasdiecast.com/hwguide.html'
          if time.monotonic()<extra_deadline:
            try:
              indexes=[]
              for link,title in listing_links(history_index):
                p=urllib.parse.urlsplit(link)
                if p.hostname not in ('southtexasdiecast.com','www.southtexasdiecast.com') or not p.path.startswith('/hwguide/') or not p.path.endswith('.html'): continue
                if not re.search(r'(?:guide\.html|treasure|firstedition|mainline|segment)',p.path,re.I): continue
                if link not in indexes: indexes.append(link)
              indexes.sort()
              cursor=int(state.get('v61 historical cursor',0))%max(1,len(indexes))
              for i in range(min(3,len(indexes))):
                if time.monotonic()>=extra_deadline: break
                url=indexes[(cursor+i)%len(indexes)]
                count=0
                for link,title in listing_links(url):
                  p=urllib.parse.urlsplit(link)
                  if p.hostname not in ('southtexasdiecast.com','www.southtexasdiecast.com') or not p.path.startswith('/hwguide/') or not p.path.endswith('.html') or link==url or link in indexes: continue
                  if len(title)<3 or re.search(r'^(home|back|next|previous|copyright|email|click here|price guide)',title,re.I): continue
                  count+=add_archive_lead('Hot Wheels',title,link,'Historical casting/series archive lead only; individual variant, actual scale and SKU unverified')
                state['v61 historical cursor']=(cursor+i+1)%len(indexes)
                log.append(['Hot Wheels','historical archive leads',url,count])
                save()
              log.append(['Hot Wheels','historical archive index pages',len(indexes)])
            except Exception as e: log.append(['Hot Wheels','historical archive blocked',str(e)])
          # Product-page verification for the new non-Shopify retailer.
          wholesale_file=root/'wholesale-product-evidence.json'
          wholesale_evidence=json.loads(wholesale_file.read_text()) if wholesale_file.exists() else {}
          class ProductHeadings(HTMLParser):
            def __init__(self):
              super().__init__();self.tag=None;self.parts=[];self.headings=[]
            def handle_starttag(self,tag,attrs):
              if tag in ('h1','h2'):
                self.tag=tag;self.parts=[]
            def handle_data(self,data):
              if self.tag: self.parts.append(data)
            def handle_endtag(self,tag):
              if tag==self.tag:
                self.headings.append((tag,' '.join(' '.join(self.parts).split())))
                self.tag=None
          def wholesale_record(html,expected_brand,expected_title):
            parser=ProductHeadings();parser.feed(html)
            titles={t for tag,t in parser.headings if tag=='h1' and t}
            skus={m.group(1) for tag,t in parser.headings if tag=='h2' and (m:=re.fullmatch(r'SKU\s*:\s*([A-Za-z0-9][A-Za-z0-9._/-]{2,60})',t,re.I))}
            if len(titles)!=1 or len(skus)!=1: return None
            title=next(iter(titles));sku=next(iter(skus))
            if wholesale_brand(title).casefold()!=expected_brand.casefold(): return None
            if re.sub(r'\W','',title.casefold())!=re.sub(r'\W','',expected_title.casefold()): return None
            if set(re.findall(r'(?<!\d)1\s*[:/]\s*(\d{1,3})(?!\d)',title))!={'64'}: return None
            return {'manufacturer':expected_brand,'sku':sku,'title':title,'variant':'Default Title'}
          assert wholesale_record('<h1>Ford GT 1/64 Diecast Model Car by Mini GT</h1><h2>SKU: MGT001</h2>','MINI GT','Ford GT 1/64 Diecast Model Car by Mini GT')['sku']=='MGT001'
          assert wholesale_record('<h1>Ford GT 1/64 Diecast Model Car by Mini GT</h1><h2>SKU: MGT001</h2><h2>SKU: MGT002</h2>','MINI GT','Ford GT 1/64 Diecast Model Car by Mini GT') is None
          assert wholesale_record('<h1>Ford GT 1/43 Diecast Model Car by Mini GT</h1><h2>SKU: MGT001</h2>','MINI GT','Ford GT 1/43 Diecast Model Car by Mini GT') is None
          wholesale_deadline=min(deadline-900,time.monotonic()+6*60)
          wholesale_attempted=0
          for row in rows:
            if time.monotonic()>=wholesale_deadline or wholesale_attempted>=80: break
            url=row['Source URL'];p=urllib.parse.urlsplit(url)
            if p.scheme!='https' or p.hostname not in ('www.diecastmodelswholesale.com','diecastmodelswholesale.com'): continue
            old=wholesale_evidence.get(url,{})
            if old.get('sku') or (old and not retry_due(old,168)): continue
            wholesale_attempted+=1
            try:
              result=wholesale_record(fetch(url).decode('utf-8','replace'),row['Manufacturer'],row['Model Name'])
              wholesale_evidence[url]={**(result or {'status':'no unambiguous product headings'}),'checked':now}
            except Exception as e:
              wholesale_evidence[url]={'checked':now,'error':str(e)}
              if any(x in str(e).lower() for x in ('403','429','robots','401')): break
            finally:
              wholesale_file.write_text(json.dumps(wholesale_evidence,indent=2))
          log.append(['V6.1','wholesale product pages attempted',wholesale_attempted,'exact listing details',sum(bool(x.get('sku')) for x in wholesale_evidence.values())])
          # Re-screen all accumulated leads against current catalog, without treating SKU match as variant proof.
          for row in rows:
            sku=row['Product Code'].strip()
            if sku and (row['Manufacturer'].casefold(),sku.casefold()) in codes:
              row['GitHub Status']='POSSIBLE DUPLICATE'
          # V3: bounded product-page evidence extraction, with persistent rotation.
          import re
          from html import unescape
          from collections import defaultdict
          def scales(title):
            return set(re.findall(r'(?<!\d)1\s*[:/]\s*(\d{1,3})(?!\d)',title or ''))
          def excluded(row):
            s=scales(row['Model Name']+' '+row['Color/Variant'])
            return bool(s and '64' not in s)
          groups=defaultdict(list)
          for row in rows:
            if row['Source URL'] and not excluded(row): groups[row['Manufacturer']].append(row)
          evidencefile=root/'evidence.json'
          evidence=json.loads(evidencefile.read_text()) if evidencefile.exists() else {}
          # Round-robin pending evidence; no artificial waiting or repeated requests.
          from collections import deque
          queues={}
          for brand,items in groups.items():
            cursor=state.get(brand+' verify cursor',0)%len(items)
            ordered=items[cursor:]+items[:cursor]
            queues[brand]=deque(row for row in ordered if evidence_due(evidence.get(row['Source URL'],{})))
          blocked_hosts=set()
          inspected=0
          verify_deadline=min(deadline,started+20*60)
          while time.monotonic()<verify_deadline and any(queues.values()):
            for brand,q in queues.items():
              if time.monotonic()>=verify_deadline: break
              if not q: continue
              row=q.popleft()
              url=row['Source URL']
              host=urllib.parse.urlsplit(url).netloc
              if host in blocked_hosts: continue
              previous=evidence.get(url,{})
              if not evidence_due(previous): continue
              try:
                p=urllib.parse.urlsplit(url)
                variant_id=urllib.parse.parse_qs(p.query).get('variant',[''])[0]
                if '/products/' not in p.path or not variant_id:
                  evidence[url]={'checked':now,'method':'product-json-v43','status':'manual review required: no exact Shopify variant identifier'}
                else:
                  endpoint=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path.rstrip('/')+'.js','',''))
                  product=json.loads(fetch(endpoint))
                  variant=next((v for v in product.get('variants',[]) if str(v.get('id'))==variant_id),None)
                  if variant is None: raise ValueError('exact variant missing')
                  title=str(product.get('title',''))+' '+str(variant.get('title',''))
                  sku=str(variant.get('sku') or '').strip()
                  evidence[url]={'checked':now,'method':'product-json-v43','product_title':title,'product_scales':sorted(scales(title)),'variant_id':variant_id,'variant_sku':sku,'vendor':product.get('vendor'),'sku_match':bool(sku and sku.casefold()==row['Product Code'].strip().casefold()),'status':'retailer product evidence; independent manufacturer confirmation required'}
                row['Last Checked Date']=now
              except Exception as e:
                evidence[url]={'checked':now,'error':str(e),'v43_attempts':previous.get('v43_attempts',0)+1}
                log.append([brand,'verification blocked',str(e)])
                if any(x in str(e).lower() for x in ('403','429','robots','401')):
                  blocked_hosts.add(host)
              inspected+=1
              state[brand+' verify cursor']=(state.get(brand+' verify cursor',0)+1)%len(groups[brand])
              if inspected%10==0:
                evidencefile.write_text(json.dumps(evidence,indent=2))
                save()
          evidencefile.write_text(json.dumps(evidence,indent=2))
