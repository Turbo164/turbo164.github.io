name: Turbo164 research V5.5
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0-23/2 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: turbo164-research-pilot
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recover previous pilot state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research
          run=$(gh run list --workflow turbo164-research.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then gh run download "$run" -n turbo164-research -D research; fi
      - name: Import historical checkpoint if supplied
        run: |
          mkdir -p research-master
          if [ -f research-master/historical.csv ]; then
            echo 'Historical checkpoint present'
          else
            echo 'Historical checkpoint missing; preserving recovered pilot history only'
          fi
      - name: Collect research leads
        run: |
          python - <<'PY'
          import csv, json, time, pathlib, urllib.request, urllib.parse, urllib.robotparser, datetime, hashlib
          from zoneinfo import ZoneInfo
          root=pathlib.Path('research')
          statefile=root/'state.json'
          state=json.loads(statefile.read_text()) if statefile.exists() else {}
          master=root/'pilot-leads.csv'
          cols=['Check Date (Bangkok)','Manufacturer','Product Code','Car Make','Model Name','Color/Variant','Edition Type','Release Status','Photo URL','Photo Source URL','Image Status','Source URL','GitHub Status','Verification','Notes','GitHub Model ID','First Seen Date','Last Checked Date']
          rows=list(csv.DictReader(master.open())) if master.exists() else []
          now=datetime.datetime.now(ZoneInfo('Asia/Bangkok')).isoformat()
          started=time.monotonic()
          deadline=started+53*60
          ua='Turbo164Research/1.0 (+https://turbo164.github.io/)'
          catalog=json.loads(pathlib.Path('catalog.json').read_text())
          codes={(str(x.get('manufacturer','')).casefold(),str(x.get('productCode','')).casefold()) for x in catalog if x.get('productCode')}
          seen={(r['Manufacturer'],r['Source URL'],r['Product Code'],r['Color/Variant']) for r in rows}
          sources=[
            ('Tarmac Works','https://www.tarmacworks.com/collections/1-64-scale'),
            ('Hobby Japan','https://www.modelcarshouston.com/collections/hobby-japan-minicar-project'),
            ('Johnny Lightning','https://www.autoworldstore.com/collections/johnny-lightning-1-64-scale'),
            ('Auto World','https://www.autoworldstore.com/collections/auto-world-1-64-scale'),
            ('PGM','https://www.modelcarshouston.com/collections/pgm'),
            ('MINI GT','https://www.modelcarshouston.com/collections/mini-gt'),
            ('INNO64','https://www.modelcarshouston.com/collections/inno64'),
            ('POP RACE','https://www.modelcarshouston.com/collections/pop-race'),
            ('Kaido House','https://www.modelcarshouston.com/collections/kaido-house'),
            ('Ignition Model','https://www.modelcarshouston.com/collections/ignition-model'),
            ('GreenLight','https://www.modelcarshouston.com/collections/greenlight'),
            ('M2 Machines','https://www.modelcarshouston.com/collections/m2-machines')]
          log=[]
          def fetch(url):
            if time.monotonic()>=deadline: raise RuntimeError('research deadline reached')
            p=urllib.parse.urlsplit(url)
            url=urllib.parse.urlunsplit((p.scheme,p.netloc,urllib.parse.quote(p.path,safe="/%:@!$&'()*+,;=-._~"),urllib.parse.quote(p.query,safe='=&%+/:?'),''))
            robots=urllib.robotparser.RobotFileParser(p.scheme+'://'+p.netloc+'/robots.txt')
            robots.read()
            if not robots.can_fetch(ua,url): raise RuntimeError('robots disallows')
            time.sleep(max(2,robots.crawl_delay(ua) or 0))
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=20) as f:
              return f.read(8_000_000)
          def save():
            tmp=master.with_suffix('.tmp')
            with tmp.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(rows)
            tmp.replace(master)
            statefile.write_text(json.dumps(state,indent=2))
          # V5.4: broaden discovery with additional retailer collections.
          # V5.2: rotate collection priority and revisit previously seen pages for changes.
          offset=state.get('collection_rotation',0)%len(sources)
          sources=sources[offset:]+sources[:offset]
          state['collection_rotation']=offset+1
          for brand,base in sources:
            page=state.get(base,1)
            try:
              for _ in range(2):
                if time.monotonic()>deadline: break
                url=base+'/products.json?limit=250&page='+str(page)
                products=json.loads(fetch(url))['products']
                if not products:
                  state[base]=1;break
                digest=hashlib.sha256(json.dumps([p.get('id') for p in products]).encode()).hexdigest()
                if digest in state.get(base+' fingerprints',[]):
                  log.append([brand,'repeated page; checking variants for changes',page])
                for p in products:
                  for v in p.get('variants',[]):
                    sku=str(v.get('sku') or '').strip()
                    link=base.split('/collections/')[0]+'/products/'+p['handle']+'?variant='+str(v['id'])
                    key=(brand,link,sku,str(v.get('title','')))
                    if key in seen: continue
                    seen.add(key)
                    row=dict.fromkeys(cols,'')
                    row.update({'Check Date (Bangkok)':now,'Manufacturer':brand,'Product Code':sku,'Model Name':p['title'],'Color/Variant':key[3],'Source URL':link,'Image Status':'MISSING PHOTO','GitHub Status':'POSSIBLE DUPLICATE' if sku and (brand.casefold(),sku.casefold()) in codes else 'NEEDS VERIFICATION','Verification':'NEEDS VERIFICATION','Notes':'Shopify lead only; scale, manufacturer SKU, edition and release require independent verification','First Seen Date':now,'Last Checked Date':now})
                    rows.append(row)
                log.append([brand,'page collected',page,len(products)])
                state[base+' fingerprints']=(state.get(base+' fingerprints',[])+[digest])[-100:]
                page+=1;state[base]=page;save()
            except Exception as e:
              log.append([brand,'blocked',str(e)])
          # Discover links on official archives; never infer SKU or scale from URL.
          from html.parser import HTMLParser
          class Links(HTMLParser):
            def __init__(self):
              super().__init__(); self.links=[]; self.href=None; self.parts=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a': self.href=dict(attrs).get('href'); self.parts=[]
            def handle_data(self,data):
              if self.href: self.parts.append(data)
            def handle_endtag(self,tag):
              if tag=='a' and self.href:
                self.links.append((self.href,' '.join(self.parts).strip())); self.href=None
          archives=[
            ('MINI GT','https://minigt.tsm-models.com/index.php?action=product-list&b_id=13&p='),
            ('INNO64','https://www.inno-models.com/scale/1-64/'),
            ('ARBOX','https://www.armodel.com.cn/product.html?cid=22'),
            ('PGM','https://www.modelcarshouston.com/collections/pgm'),
            ('POP RACE','https://www.poprace.net/'),
            ('Ignition Model','https://ig-model.com/'),
            ('GreenLight','https://www.greenlightcollectibles.com/'),
            ('M2 Machines','https://www.m2machines.com/'),
            ('Kaido House','https://kaidohouse.com/')]
          for brand,base in archives:
            if time.monotonic()>deadline: break
            try:
              page=state.get(brand+' archive page',1)
              url=base+str(page) if brand=='MINI GT' else base
              parser=Links();parser.feed(fetch(url).decode('utf-8','replace'))
              count=0
              for href,title in parser.links:
                link=urllib.parse.urljoin(url,href)
                if not title or urllib.parse.urlsplit(link).netloc!=urllib.parse.urlsplit(url).netloc: continue
                if not any(s in link.lower() for s in ('product/detail','product-detail','product_detail','product-info','product_id=','/products/','/product/','action=product')): continue
                if 'product-list' in link or link==url: continue
                key=(brand,link,'','')
                if key in seen: continue
                seen.add(key);count+=1
                row=dict.fromkeys(cols,'')
                row.update({'Check Date (Bangkok)':now,'Manufacturer':brand,'Model Name':title,'Source URL':link,'Image Status':'MISSING PHOTO','GitHub Status':'NEEDS VERIFICATION','Verification':'NEEDS VERIFICATION','Notes':'Archive link lead; product identity and scale unverified','First Seen Date':now,'Last Checked Date':now})
                rows.append(row)
              if brand=='MINI GT': state[brand+' archive page']=page+1 if count else 1
              log.append([brand,'archive links',count]);save()
            except Exception as e: log.append([brand,'blocked',str(e)])
          # Wiki category discovery with continuation, not official product codes.
          for brand,host in [('Hot Wheels','hotwheels'),('Matchbox','matchbox'),('Tomica','tomica'),('Majorette','majorette')]:
            if time.monotonic()>deadline: break
            try:
              base='https://'+host+'.fandom.com'
              params={'action':'query','list':'categorymembers','cmtitle':'Category:Cars','cmlimit':50,'format':'json'}
              params.update(state.get(brand+' continuation',{}))
              data=json.loads(fetch(base+'/api.php?'+urllib.parse.urlencode(params)))
              count=0
              for item in data['query']['categorymembers']:
                if item.get('ns')!=0: continue
                title=item['title'];link=base+'/wiki/'+urllib.parse.quote(title.replace(' ','_'))
                key=(brand,link,'','')
                if key in seen: continue
                seen.add(key);count+=1
                row=dict.fromkeys(cols,'')
                row.update({'Check Date (Bangkok)':now,'Manufacturer':brand,'Model Name':title,'Source URL':link,'Image Status':'MISSING PHOTO','GitHub Status':'NEEDS VERIFICATION','Verification':'NEEDS VERIFICATION','Notes':'Wiki lead only; exact scale, SKU and variant unverified','First Seen Date':now,'Last Checked Date':now})
                rows.append(row)
              state[brand+' continuation']=data.get('continue',{})
              log.append([brand,'wiki leads',count]);save()
            except Exception as e: log.append([brand,'blocked',str(e)])
          # Re-screen all accumulated leads against current catalog, without treating SKU match as variant proof.
          for row in rows:
            sku=row['Product Code'].strip()
            if sku and (row['Manufacturer'].casefold(),sku.casefold()) in codes:
              row['GitHub Status']='POSSIBLE DUPLICATE'
          # V3: bounded product-page evidence extraction, with persistent rotation.
          import re
          from html import unescape
          from collections import defaultdict
          def scales(title):
            return set(re.findall(r'(?<!\d)1\s*[:/]\s*(\d{1,3})(?!\d)',title or ''))
          def excluded(row):
            s=scales(row['Model Name']+' '+row['Color/Variant'])
            return bool(s and '64' not in s)
          groups=defaultdict(list)
          for row in rows:
            if row['Source URL'] and not excluded(row): groups[row['Manufacturer']].append(row)
          evidencefile=root/'evidence.json'
          evidence=json.loads(evidencefile.read_text()) if evidencefile.exists() else {}
          # Round-robin pending evidence; no artificial waiting or repeated requests.
          from collections import deque
          queues={}
          for brand,items in groups.items():
            cursor=state.get(brand+' verify cursor',0)%len(items)
            ordered=items[cursor:]+items[:cursor]
            queues[brand]=deque(row for row in ordered if row['Source URL'] not in evidence or (evidence[row['Source URL']].get('method')!='product-json-v43' and evidence[row['Source URL']].get('v43_attempts',0)<3))
          blocked_hosts=set()
          inspected=0
          while time.monotonic()<deadline and any(queues.values()):
            for brand,q in queues.items():
              if time.monotonic()>=deadline: break
              if not q: continue
              row=q.popleft()
              url=row['Source URL']
              host=urllib.parse.urlsplit(url).netloc
              if host in blocked_hosts: continue
              previous=evidence.get(url,{})
              if previous.get('method')=='product-json-v43' or previous.get('v43_attempts',0)>=3: continue
              try:
                p=urllib.parse.urlsplit(url)
                variant_id=urllib.parse.parse_qs(p.query).get('variant',[''])[0]
                if '/products/' not in p.path or not variant_id:
                  evidence[url]={'checked':now,'method':'product-json-v43','status':'manual review required: no exact Shopify variant identifier'}
                else:
                  endpoint=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path.rstrip('/')+'.js','',''))
                  product=json.loads(fetch(endpoint))
                  variant=next((v for v in product.get('variants',[]) if str(v.get('id'))==variant_id),None)
                  if variant is None: raise ValueError('exact variant missing')
                  title=str(product.get('title',''))+' '+str(variant.get('title',''))
                  sku=str(variant.get('sku') or '').strip()
                  evidence[url]={'checked':now,'method':'product-json-v43','product_title':title,'product_scales':sorted(scales(title)),'variant_id':variant_id,'variant_sku':sku,'vendor':product.get('vendor'),'sku_match':bool(sku and sku.casefold()==row['Product Code'].strip().casefold()),'status':'retailer product evidence; independent manufacturer confirmation required'}
                row['Last Checked Date']=now
              except Exception as e:
                evidence[url]={'checked':now,'error':str(e),'v43_attempts':previous.get('v43_attempts',0)+1}
                log.append([brand,'verification blocked',str(e)])
                if any(x in str(e).lower() for x in ('403','429','robots','401')):
                  blocked_hosts.add(host)
              inspected+=1
              if inspected%10==0:
                evidencefile.write_text(json.dumps(evidence,indent=2))
                save()
          evidencefile.write_text(json.dumps(evidence,indent=2))
          save()
          log.append(['V4.1','new page inspections',inspected,'deadline reached' if time.monotonic()>=deadline else 'pending accessible queue exhausted'])
          # V4.2: review queue, never publish on page-wide evidence alone.
          def norm(s):
            return re.sub(r'[^a-z0-9]+','',str(s or '').casefold())
          catalog_index=defaultdict(list)
          for item in catalog:
            for code in {norm(item.get('productCode')),norm(item.get('number'))}-{''}:
              catalog_index[(norm(item.get('manufacturer')),code)].append(item)
          review=[]
          quarantine=[]
          for row in rows:
            sku=row['Product Code'].strip()
            ev=evidence.get(row['Source URL'],{})
            matches=catalog_index.get((norm(row['Manufacturer']),norm(sku)),[]) if sku else []
            if matches:
              row['GitHub Status']='POSSIBLE DUPLICATE'
            if excluded(row) or (ev.get('product_scales') and '64' not in ev['product_scales']):
              quarantine.append({**row,'Notes':row['Notes']+' | Explicit non-1:64 scale; excluded from review'})
              continue
            if not sku or ev.get('method')!='product-json-v43' or ev.get('product_scales')!=['64'] or not ev.get('sku_match') or matches: continue
            review.append({**row,'Notes':row['Notes']+' | REVIEW ONLY: exact variant, scale and manufacturer SKU not yet proven'})
          with (root/'review-queue.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(review)
          with (root/'quarantine.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(quarantine)
          # V4.5: search independent retailer storefronts by exact SKU.
          searchfile=root/'independent-search.json'
          searches=json.loads(searchfile.read_text()) if searchfile.exists() else {}
          retailers=['https://www.modelcarshouston.com','https://www.autoworldstore.com','https://www.tarmacworks.com']
          # Inspect discovered links before spending the remaining budget on discovery.
          hitfile=root/'independent-product-evidence.json'
          hit_evidence=json.loads(hitfile.read_text()) if hitfile.exists() else {}
          review_index=defaultdict(list)
          for row in review:
            review_index[(row['Manufacturer'],row['Product Code'])].append(row)
          # V4.9: cache actual product payloads across SKU queries and rounds.
          cachefile=root/'product-payload-cache.json'
          payload_cache=json.loads(cachefile.read_text()) if cachefile.exists() else {}
          cache_hits=0
          inspection_deadline=min(deadline,started+20*60)
          for key,record in list(searches.items()):
            if time.monotonic()>=inspection_deadline: break
            parts=key.split('|',2)
            if len(parts)!=3: continue
            base,brand,sku=parts
            sku=sku.removesuffix('|model')
            for hit in record.get('hits',[]):
              if time.monotonic()>=inspection_deadline: break
              url=hit.get('url') or ''
              p=urllib.parse.urlsplit(url)
              if p.scheme!='https' or p.netloc!=urllib.parse.urlsplit(base).netloc or '/products/' not in p.path: continue
              ident=key+'|'+url
              if ident in hit_evidence and not hit_evidence[ident].get('error'): continue
              if hit_evidence.get(ident,{}).get('attempts',0)>=3: continue
              try:
                endpoint=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path.rstrip('/')+'.js','',''))
                if endpoint in payload_cache:
                  product=payload_cache[endpoint]
                  cache_hits+=1
                else:
                  product=json.loads(fetch(endpoint))
                  payload_cache[endpoint]={'title':product.get('title'),'vendor':product.get('vendor'),'variants':[{'id':v.get('id'),'sku':v.get('sku'),'title':v.get('title')} for v in product.get('variants',[])]}
                  cachefile.write_text(json.dumps(payload_cache))
                matches=[]
                for v in product.get('variants',[]):
                  title=str(product.get('title',''))+' '+str(v.get('title',''))
                  if str(v.get('sku') or '').strip().casefold()!=sku.strip().casefold() or scales(title)!={'64'}: continue
                  matches.append({'sku':v['sku'],'variant_id':v.get('id'),'title':product.get('title'),'variant':v.get('title'),'vendor':product.get('vendor'),'url':url.split('?')[0]+'?variant='+str(v.get('id'))})
                hit_evidence[ident]={'checked':now,'manufacturer_requested':brand,'matches':matches,'status':'review only; manufacturer and edition require confirmation'}
              except Exception as e:
                hit_evidence[ident]={'checked':now,'error':str(e),'attempts':hit_evidence.get(ident,{}).get('attempts',0)+1}
              hitfile.write_text(json.dumps(hit_evidence,indent=2))
          log.append(['V4.6','product links inspected',len(hit_evidence),'exact scale/SKU matches',sum(len(x.get('matches',[])) for x in hit_evidence.values())])
          log.append(['V4.9','cached product requests avoided',cache_hits,'unique cached endpoints',len(payload_cache)])
          pending=defaultdict(deque)
          for row in review:
            sku=row['Product Code'].strip()
            if not sku: continue
            for base in retailers:
              if urllib.parse.urlsplit(base).netloc==urllib.parse.urlsplit(row['Source URL']).netloc: continue
              key=base+'|'+row['Manufacturer']+'|'+sku
              if key not in searches: pending[row['Manufacturer']].append((row,base,key))
              elif not searches[key].get('hits') and key+'|model' not in searches: pending[row['Manufacturer']].append((row,base,key+'|model'))
          search_count=0
          search_deadline=min(deadline,started+40*60)
          while time.monotonic()<search_deadline and any(pending.values()):
            for brand,q in pending.items():
              if time.monotonic()>=deadline: break
              if not q: continue
              row,base,key=q.popleft()
              if key in searches or urllib.parse.urlsplit(base).netloc in blocked_hosts: continue
              try:
                query=urllib.parse.urlencode({'q':(row['Manufacturer']+' '+row['Model Name']) if key.endswith('|model') else row['Product Code'],'resources[type]':'product','resources[limit]':10})
                data=json.loads(fetch(base+'/search/suggest.json?'+query))
                hits=data.get('resources',{}).get('results',{}).get('products',[])
                searches[key]={'checked':now,'hits':[{'title':p.get('title'),'url':urllib.parse.urljoin(base,p.get('url') or '')} for p in hits],'status':'discovery only; exact SKU and variant not verified'}
              except Exception as e:
                searches[key]={'checked':now,'error':str(e)}
                if any(x in str(e).lower() for x in ('403','429','robots','401','404')):
                  blocked_hosts.add(urllib.parse.urlsplit(base).netloc)
              search_count+=1
              if search_count%10==0:
                searchfile.write_text(json.dumps(searches,indent=2))
                save()
          searchfile.write_text(json.dumps(searches,indent=2))
          log.append(['V4.5','independent storefront searches',search_count])
          # Independent cross-source corroboration, not automatic approval.
          cross=defaultdict(list)
          for row in rows:
            ev=evidence.get(row['Source URL'],{})
            if ev.get('method')=='product-json-v43' and ev.get('product_scales')==['64'] and ev.get('sku_match'):
              cross[(norm(row['Manufacturer']),norm(row['Product Code']))].append(row)
          corroborated=[]
          for row in review:
            key=(norm(row['Manufacturer']),norm(row['Product Code']))
            host=urllib.parse.urlsplit(row['Source URL']).hostname or ''
            peers=[p for p in cross[key] if (urllib.parse.urlsplit(p['Source URL']).hostname or '').removeprefix('www.')!=host.removeprefix('www.') and norm(p['Model Name'])==norm(row['Model Name']) and norm(p['Color/Variant'])==norm(row['Color/Variant'])]
            if peers:
              corroborated.append({**row,'Notes':row['Notes']+' | Cross-source match: '+peers[0]['Source URL']})
          with (root/'corroborated-review.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(corroborated)
          # V4.7: manufacturer-aware review, never infer edition or publish automatically.
          candidate_rows=[]
          rejected=[]
          candidate_keys=set()
          aliases={'tarmacworks':'tarmacworks','minigt':'minigt','inno64':'inno64','hobbyjapan':'hobbyjapan','autoworld':'autoworld','johnnylightning':'johnnylightning','kaidohouse':'kaidohouse'}
          def brandkey(value):
            k=norm(value)
            return aliases.get(k,k)
          for ident,record in hit_evidence.items():
            brand=record.get('manufacturer_requested','')
            for match in record.get('matches',[]):
              sku=str(match.get('sku','')).strip()
              vendor=match.get('vendor','')
              key=(brandkey(brand),norm(sku))
              title=str(match.get('title',''))+' '+str(match.get('variant',''))
              reason=''
              if not sku or not brand or brandkey(vendor)!=brandkey(brand): reason='manufacturer mismatch or missing vendor'
              elif scales(title)!={'64'}: reason='scale not explicit'
              elif re.search(r'\b(bundle|set of|case of|assortment|multipack|multi.pack|combo|trading.card|gift.set|2.pack|3.pack)\b',title,re.I): reason='possible bundle'
              elif catalog_index.get(key): reason='possible existing SKU'
              elif key in candidate_keys: reason='duplicate candidate SKU; inspect variants manually'
              if reason:
                rejected.append({'manufacturer':brand,'reason':reason,**match});continue
              candidate_keys.add(key)
              candidate_rows.append({'manufacturer':brand,'productCode':sku,'name':match.get('title'),'variant':match.get('variant'),'sourceUrl':match.get('url'),'vendor':vendor,'releaseStatus':'unconfirmed','editionType':'unconfirmed','verification':'NEEDS VERIFICATION','photo':None})
          (root/'manufacturer-review.json').write_text(json.dumps({'candidates':candidate_rows,'excluded':rejected},indent=2))
          log.append(['V4.7','manufacturer-matched review candidates',len(candidate_rows),'excluded or duplicate',len(rejected)])
          # V4.9: targeted official storefront discovery for matched Tarmac candidates.
          officialfile=root/'official-discovery.json'
          official_discovery=json.loads(officialfile.read_text()) if officialfile.exists() else {}
          for item in candidate_rows:
            if time.monotonic()>=deadline-300: break
            if norm(item['manufacturer'])!='tarmacworks': continue
            sku=item['productCode']
            if sku in official_discovery: continue
            try:
              base='https://www.tarmacworks.com'
              query=urllib.parse.urlencode({'q':sku,'resources[type]':'product','resources[limit]':10})
              result=json.loads(fetch(base+'/search/suggest.json?'+query))
              official_discovery[sku]={'checked':now,'hits':result.get('resources',{}).get('results',{}).get('products',[]),'status':'official discovery only; exact variant verification pending'}
            except Exception as e:
              official_discovery[sku]={'checked':now,'error':str(e)}
              if any(x in str(e).lower() for x in ('403','429','robots','401')): break
            finally:
              officialfile.write_text(json.dumps(official_discovery,indent=2))
          # V5.0: independently fetch official exact variant payloads.
          verified_official=[]
          official_errors=[]
          for item in candidate_rows:
            if time.monotonic()>=deadline-30: break
            if norm(item['manufacturer'])!='tarmacworks': continue
            sku=item['productCode']
            for hit in official_discovery.get(sku,{}).get('hits',[]):
              if time.monotonic()>=deadline-30: break
              url=urllib.parse.urljoin('https://www.tarmacworks.com',hit.get('url') or '')
              p=urllib.parse.urlsplit(url)
              if p.scheme!='https' or p.hostname not in ('www.tarmacworks.com','tarmacworks.com') or '/products/' not in p.path: continue
              try:
                endpoint=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path.rstrip('/')+'.js','',''))
                product=json.loads(fetch(endpoint))
                for v in product.get('variants',[]):
                  title=str(product.get('title',''))+' '+str(v.get('title',''))
                  if str(v.get('sku') or '').strip().casefold()!=sku.strip().casefold() or scales(title)!={'64'}: continue
                  if norm(product.get('vendor'))!='tarmacworks': continue
                  if re.search(r'\b(bundle|combo|multipack|assortment|trading.card|gift.set|set of|case of|multi.pack|2.pack|3.pack)\b',title,re.I): continue
                  if catalog_index.get(('tarmacworks',norm(sku))): continue
                  verified_official.append({'manufacturer':'Tarmac Works','productCode':sku,'name':product.get('title'),'variant':v.get('title'),'sourceUrl':url.split('?')[0]+'?variant='+str(v.get('id')),'checked':now,'verification':'Official SKU and scale matched; edition, release and identity review pending','retailerSource':item.get('sourceUrl')})
              except Exception as e:
                official_errors.append({'sku':sku,'url':url,'error':str(e)})
          (root/'official-variant-verification.json').write_text(json.dumps({'matches':verified_official,'errors':official_errors},indent=2))
          log.append(['V5.0','official exact variant matches',len(verified_official),'errors',len(official_errors)])
          # V4.8: official-source evidence gate, with explicit release and edition review.
          official_review=[]
          for item in candidate_rows:
            p=urllib.parse.urlsplit(item.get('sourceUrl') or '')
            official=(norm(item['manufacturer'])=='tarmacworks' and p.scheme=='https' and p.hostname in ('www.tarmacworks.com','tarmacworks.com'))
            title=str(item.get('name') or '')+' '+str(item.get('variant') or '')
            flags=[]
            if not official: flags.append('official manufacturer product evidence missing')
            if re.search(r'\b(combo|bundle|trading.card|gift.set|multipack|assortment)\b',title,re.I): flags.append('possible combination product')
            release='preorder' if re.search(r'\bpre[- ]?order\b',title,re.I) else 'unconfirmed'
            edition='chase' if re.search(r'\bchase\b',title,re.I) else 'unconfirmed'
            if release=='unconfirmed': flags.append('release status requires evidence')
            if edition=='unconfirmed': flags.append('edition requires evidence')
            flags.append('exact catalog variant and car make require final review')
            official_review.append({**item,'official_source_host':official,'release_hint':release,'edition_hint':edition,'review_flags':flags})
          (root/'official-source-review.json').write_text(json.dumps(official_review,indent=2))
          log.append(['V4.8','official-host candidates',sum(x['official_source_host'] for x in official_review),'publication approved',0])
          # V5.2: collect explicit edition/release evidence from official product descriptions.
          detailfile=root/'official-detail-evidence.json'
          details=json.loads(detailfile.read_text()) if detailfile.exists() else {}
          for item in verified_official:
            if time.monotonic()>=deadline-45: break
            url=item['sourceUrl']
            p=urllib.parse.urlsplit(url)
            if p.scheme!='https' or p.hostname not in ('www.tarmacworks.com','tarmacworks.com'): continue
            try:
              endpoint=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path.rstrip('/')+'.js','',''))
              product=json.loads(fetch(endpoint))
              variant_id=urllib.parse.parse_qs(p.query).get('variant',[''])[0]
              v=next((v for v in product.get('variants',[]) if str(v.get('id'))==variant_id and str(v.get('sku') or '').casefold()==item['productCode'].casefold()),None)
              if v is None: continue
              description=unescape(re.sub(r'<[^>]+>',' ',str(product.get('description') or '')))
              sentences=re.split(r'[\n.!?]+',description)
              excerpts=[s.strip()[:500] for s in sentences if re.search(r'\b(chase|limited|exclusive|regular|pre[- ]?order|release|in stock|sold out|shipping)\b',s,re.I)]
              details[url]={'checked':now,'sku':item['productCode'],'title':product.get('title'),'variant':v.get('title'),'available':v.get('available'),'evidence_excerpts':excerpts[:20],'status':'manual classification required; availability is not release status'}
            except Exception as e:
              log.append(['V5.2','official detail error',str(e)])
            detailfile.write_text(json.dumps(details,indent=2))
          log.append(['V5.2','official detail evidence records',len(details)])
          # V5.1: final review gate; never infer release or edition from missing evidence.
          final_review=[]
          final_keys=set()
          for item in verified_official:
            key=(norm(item['manufacturer']),norm(item['productCode']))
            if key in final_keys or catalog_index.get(key): continue
            final_keys.add(key)
            title=str(item.get('name') or '')+' '+str(item.get('variant') or '')
            if re.search(r'\b(bundle|combo|multipack|assortment|trading.card|gift.set|set of|case of|multi.pack|2.pack|3.pack)\b',title,re.I): continue
            detail=details.get(item['sourceUrl'],{})
            excerpts=detail.get('evidence_excerpts',[]) if detail.get('sku')==item['productCode'] else []
            final_review.append({**item,'official_description_evidence':excerpts,'limited_production_hint':any(re.search(r'\blimited\b',x,re.I) for x in excerpts),'chase_mentioned_in_description':any(re.search(r'\bchase\b',x,re.I) for x in excerpts),'edition_hint':'chase' if re.search(r'\bchase\b',title,re.I) else 'unconfirmed','release_hint':'preorder' if re.search(r'\bpre[- ]?order\b',title,re.I) else 'unconfirmed','publication_status':'NEEDS VERIFICATION','required_review':['car make and exact model identity','edition and release evidence','fresh main catalog duplicate check']})
          (root/'final-publication-review.json').write_text(json.dumps(final_review,indent=2))
          log.append(['V5.1','unique official candidates for final review',len(final_review),'approved for publication',0])
          # V5.4: retain official matches as actionable evidence, not just review notes.
          for item in final_review:
            for row in rows:
              if norm(row['Manufacturer'])!=norm(item['manufacturer']) or norm(row['Product Code'])!=norm(item['productCode']): continue
              if row['Source URL']!=item['sourceUrl']: continue
              row['Verification']='Official exact SKU and 1:64 scale confirmed; edition and release pending'
              row['Last Checked Date']=item['checked']
          save()
          # Preserve historical master separately from the pilot evidence queue.
          historical=pathlib.Path('research-master/historical.csv')
          combined=[]
          identities={}
          for source in ([historical] if historical.exists() else [])+([root/'cumulative-master.csv'] if (root/'cumulative-master.csv').exists() else [])+[master]:
            with source.open(encoding='utf-8-sig',newline='') as f:
              for original in csv.DictReader(f):
                item={k:original.get(k,'') for k in cols}
                key=tuple(item[k] for k in ('Manufacturer','Product Code','Model Name','Color/Variant','Source URL'))
                if key in identities:
                  old=combined[identities[key]]
                  if item['Last Checked Date']>old['Last Checked Date']:
                    for field in ('Last Checked Date','Check Date (Bangkok)'):
                      old[field]=item[field]
                  for field in cols:
                    if not old[field] and item[field]: old[field]=item[field]
                  dates=[d for d in (old['First Seen Date'],item['First Seen Date']) if d]
                  if dates: old['First Seen Date']=min(dates)
                  continue
                identities[key]=len(combined);combined.append(item)
          # Reconcile exact official evidence without inventing edition or release.
          official_by_sku=defaultdict(list)
          for item in final_review:
            official_by_sku[(norm(item['manufacturer']),norm(item['productCode']))].append(item)
          for row in combined:
            key=(norm(row['Manufacturer']),norm(row['Product Code']))
            matches=official_by_sku.get(key,[]) if key[1] else []
            if len(matches)==1:
              item=matches[0]
              row['Notes']+=' | Official evidence: '+item['sourceUrl'] if item['sourceUrl'] not in row['Notes'] else ''
            if key[1] and catalog_index.get(key) and row['GitHub Status']!='ALREADY IN GITHUB':
              row['GitHub Status']='POSSIBLE DUPLICATE'
          with (root/'cumulative-master.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(combined)
          log.append(['V4.4','historical master available',historical.exists(),'combined records',len(combined),'cross-source candidates',len(corroborated)])
          (root/'publication-preview.json').write_text(json.dumps({'eligible_verified':0,'quarantined':len(quarantine),'review_candidates':len(review),'additions':[],'manufacturer_matched_review':candidate_rows,'official_final_review':final_review,'reason':'Exact product-level evidence and historical master reconciliation required before publication'},indent=2))
          save()
          stamp=datetime.datetime.now(ZoneInfo('Asia/Bangkok')).strftime('%Y-%m-%d_%H%M')
          import shutil
          for old in root.glob('Turbo164_Pilot_Leads_*.csv'):
            old.unlink()
          for old in root.glob('Turbo164_Master_Catalog_*.csv'):
            old.unlink()
          shutil.copyfile(master,root/('Turbo164_Pilot_Leads_'+stamp+'.csv'))
          shutil.copyfile(root/'cumulative-master.csv',root/('Turbo164_Master_Catalog_'+stamp+'.csv'))
          (root/'coverage.json').write_text(json.dumps({'time':now,'pilot_only':True,'version':'5.5','historical_master_present':historical.exists(),'cumulative_count':len(combined),'review_candidates':len(review),'elapsed_research_seconds':round(time.monotonic()-started),'catalog_count':len(catalog),'lead_count':len(rows),'sources':log,'publication':'disabled; no verified master merge'},indent=2))
          print(json.dumps(log))
          PY
      - name: Publish verified missing models
        run: |
          python - <<'PY'
          import json,pathlib,re,subprocess
          root=pathlib.Path('research')
          report={'published':0,'status':'not started'}
          def git(*args):
            return subprocess.check_output(['git',*args],text=True).strip()
          def norm(s):
            return re.sub(r'[^a-z0-9]','',str(s or '').lower())
          try:
            git('fetch','origin','main')
            git('checkout','--detach','origin/main')
            p=pathlib.Path('catalog.json')
            original=json.loads(p.read_text())
            assert isinstance(original,list)
            ids={x['id'] for x in original}
            assert len(ids)==len(original)
            codes={(norm(x.get('manufacturer')),norm(x.get(k))) for x in original for k in ('number','productCode') if x.get(k)}
            names={(norm(x.get('manufacturer')),norm(x.get('name'))) for x in original}
            additions=[]
            makes=['Mercedes-Benz','Alfa Romeo','Land Rover','Aston Martin','Volkswagen','Porsche','Ferrari','Nissan','Toyota','Honda','Mitsubishi','Subaru','Mazda','BMW','Audi','Ford','Chevrolet','Dodge','Lamborghini','McLaren','Hyundai','Lancia','Fiat','Peugeot','Renault','Bentley','Lotus','Pagani','Bugatti','Suzuki','Isuzu','Volvo','Acura','Lexus','Datsun','Jaguar','Pontiac','Cadillac']
            for x in json.loads((root/'final-publication-review.json').read_text()):
              sku=str(x.get('productCode') or '').strip()
              title=str(x.get('name') or '').strip()
              variant=str(x.get('variant') or '').strip()
              url=str(x.get('sourceUrl') or '')
              key=('tarmacworks',norm(sku))
              if x.get('manufacturer')!='Tarmac Works' or not sku or not re.fullmatch(r'https://(?:www\.)?tarmacworks\.com/products/[^?]+\?variant=\d+',url) or not re.search(r'1\s*[:/]\s*64\b',title+' '+variant): continue
              if key in codes or ('tarmacworks',norm(title)) in names: continue
              if any(norm(y.get('manufacturer'))=='tarmacworks' and str(y.get('sourceUrl') or y.get('photoSource') or '').split('?')[0]==url.split('?')[0] for y in original): continue
              if re.search(r'\b(bundle|combo|set of|multipack|assortment|trading.card|gift.set|case of)\b',title,re.I): continue
              found=[m for m in makes if re.search(r'\b'+re.escape(m)+r'\b',title,re.I)]
              if len(found)!=1 or variant.lower() not in ('','default title','regular','standard'): continue
              make=found[0]
              edition='Unverified'
              for pattern,label in [(r'\bchase\b','Chase'),(r'\bevent (?:special|exclusive)\b','Event Exclusive'),(r'\bexclusive\b','Exclusive'),(r'\blimited edition\b','Limited Edition'),(r'\bspecial edition\b','Special Edition')]:
                if re.search(pattern,title,re.I): edition=label;break
              release='Preorder' if re.search(r'\bpre[- ]?order\b',title,re.I) else 'Unverified'
              ident='tarmac-works-'+norm(sku)
              if ident in ids: continue
              additions.append({'id':ident,'number':sku,'productCode':sku,'brand':make,'vehicleMake':make,'manufacturer':'Tarmac Works','name':title,'variant':edition,'editionType':edition,'release':release,'sourceUrl':url,'verification':'Official exact SKU and 1:64 scale confirmed; edition and release may remain unverified.'})
              ids.add(ident);codes.add(key);names.add(('tarmacworks',norm(title)))
            report['eligible']=len(additions)
            if additions:
              merged=original+additions
              p.write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n')
              assert json.loads(p.read_text())[:len(original)]==original
              assert len({x['id'] for x in merged})==len(merged)
              git('config','user.name','github-actions[bot]')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              git('add','--','catalog.json')
              assert git('diff','--cached','--name-only')=='catalog.json'
              git('commit','-m','Turbo164: add verified missing 1:64 models')
              commit=git('rev-parse','HEAD')
              git('push','origin','HEAD:refs/heads/main')
              git('fetch','origin','main')
              remote=json.loads(git('show','origin/main:catalog.json'))
              assert all(x in remote for x in additions)
              report.update(published=len(additions),status='verified readback',commit=commit,additions=additions)
            else: report['status']='no eligible additions'
          except Exception as e:
            report['status']='deferred or uncertain; do not retry blindly'
            report['error']=str(e)
          finally:
            (root/'publication-result.json').write_text(json.dumps(report,indent=2))
            print(json.dumps(report))
          PY
