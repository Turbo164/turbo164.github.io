            if len(matches)==1:
              item=matches[0]
              row['Notes']+=' | Official evidence: '+item['sourceUrl'] if item['sourceUrl'] not in row['Notes'] else ''
            if key[1] and catalog_index.get(key) and row['GitHub Status']!='ALREADY IN GITHUB':
              row['GitHub Status']='POSSIBLE DUPLICATE'
          with (root/'cumulative-master.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(combined)
