          (root/'publication-preview.json').write_text(json.dumps({'eligible_verified':0,'quarantined':len(quarantine),'review_candidates':len(review),'additions':[],'manufacturer_matched_review':candidate_rows,'official_final_review':final_review,'reason':'Exact product-level evidence and historical master reconciliation required before publication'},indent=2))
          save()
