      - name: Publish verified missing models
        run: |
          python - <<'PY'
          import json,pathlib,re,subprocess,csv,urllib.parse
          root=pathlib.Path('research')
          report={'published':0,'status':'not started'}
          def git(*args):
            return subprocess.check_output(['git',*args],text=True).strip()
          def norm(s):
            return re.sub(r'[^a-z0-9]','',str(s or '').lower())
          try:
            git('fetch','origin','main')
            git('checkout','--detach','origin/main')
            p=pathlib.Path('catalog.json')
            original=json.loads(p.read_text())
            assert isinstance(original,list)
            ids={x['id'] for x in original}
            assert len(ids)==len(original)
            codes={(norm(x.get('manufacturer')),norm(x.get(k))) for x in original for k in ('number','productCode') if x.get(k)}
            names={(norm(x.get('manufacturer')),norm(x.get('name'))) for x in original}
            additions=[]
            makes=['Mercedes-Benz','Alfa Romeo','Land Rover','Aston Martin','Volkswagen','Porsche','Ferrari','Nissan','Toyota','Honda','Mitsubishi','Subaru','Mazda','BMW','Audi','Ford','Chevrolet','Dodge','Lamborghini','McLaren','Hyundai','Lancia','Fiat','Peugeot','Renault','Bentley','Lotus','Pagani','Bugatti','Suzuki','Isuzu','Volvo','Acura','Lexus','Datsun','Jaguar','Pontiac','Cadillac']
            candidates=json.loads((root/'final-publication-review.json').read_text())+json.loads((root/'cross-publication-review.json').read_text())
            for x in candidates:
              sku=str(x.get('productCode') or '').strip()
              title=str(x.get('name') or '').strip()
              variant=str(x.get('variant') or '').strip()
              url=str(x.get('sourceUrl') or '')
              manufacturer=str(x.get('manufacturer') or '').strip()
              key=(norm(manufacturer),norm(sku))
              if not manufacturer or not sku or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]{2,60}',sku) or set(re.findall(r'(?<!\d)1\s*[:/]\s*(\d{1,3})(?!\d)',title+' '+variant))!={'64'}: continue
              if x.get('method')=='cross-source-exact-v61':
                evidence=x.get('proofs',[])
                if len(evidence)!=2: continue
                a,b=evidence
                if any(p.get('manufacturer')!=key[0] or str(p.get('sku','')).casefold()!=sku.casefold() or urllib.parse.urlsplit(p.get('url','')).scheme!='https' for p in evidence): continue
                if a.get('host')==b.get('host') or a.get('model')!=b.get('model') or len(a.get('model',''))<10 or a.get('variant')!=b.get('variant'): continue
                if a.get('url')!=url or b.get('url')!=x.get('corroboratingSource') or a.get('title')!=title or a.get('variant_title')!=variant: continue
              elif manufacturer!='Tarmac Works' or not re.fullmatch(r'https://(?:www\.)?tarmacworks\.com/products/[^?]+\?variant=\d+',url): continue
              if key in codes or (key[0],norm(title)) in names: continue
              if any(norm(y.get('manufacturer'))==key[0] and str(y.get('sourceUrl') or y.get('photoSource') or '').split('?')[0]==url.split('?')[0] for y in original): continue
              if re.search(r'\b(bundle|combo|set of|multipack|assortment|trading.card|gift.set|case of)\b',title,re.I): continue
              found=[m for m in makes if re.search(r'\b'+re.escape(m)+r'\b',title,re.I)]
              if not found and x.get('verifiedMake') in makes and x.get('makeEvidence'): found=[x['verifiedMake']]
              if len(found)!=1: continue
              if x.get('method')!='cross-source-exact-v61' and variant.lower() not in ('','default title','regular','standard'): continue
              make=found[0]
              edition='Unverified'
              for pattern,label in [(r'\bchase\b','Chase'),(r'\bevent (?:special|exclusive)\b','Event Exclusive'),(r'\bexclusive\b','Exclusive'),(r'\blimited edition\b','Limited Edition'),(r'\bspecial edition\b','Special Edition')]:
                if re.search(pattern,title+' '+variant,re.I): edition=label;break
              release='Preorder' if re.search(r'\bpre[- ]?order\b',title,re.I) else 'Unverified'
              ident=re.sub(r'[^a-z0-9]+','-',manufacturer.lower()).strip('-')+'-'+norm(sku)
              if ident in ids: continue
              addition={'id':ident,'number':sku,'productCode':sku,'brand':make,'vehicleMake':make,'manufacturer':manufacturer,'name':title,'variant':variant if variant.lower() not in ('','default title','regular','standard') else edition,'editionType':edition,'release':release,'sourceUrl':url,'verification':x.get('verification','Exact SKU and scale confirmed; edition and release may remain unverified.')}
              if x.get('corroboratingSource') or x.get('makeEvidence'): addition['verificationSource']=x.get('corroboratingSource') or x.get('makeEvidence')
              additions.append(addition)
              ids.add(ident);codes.add(key);names.add((key[0],norm(title)))
            report['eligible']=len(additions)
            if additions:
              merged=original+additions
              p.write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n')
              assert json.loads(p.read_text())[:len(original)]==original
              assert len({x['id'] for x in merged})==len(merged)
              git('config','user.name','github-actions[bot]')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              git('add','--','catalog.json')
              assert git('diff','--cached','--name-only')=='catalog.json'
              git('commit','-m','Turbo164: add verified missing 1:64 models')
              commit=git('rev-parse','HEAD')
              git('push','origin','HEAD:refs/heads/main')
              git('fetch','origin','main')
              remote=json.loads(git('show','origin/main:catalog.json'))
              assert all(x in remote for x in additions)
              report.update(published=len(additions),status='verified readback',commit=commit,additions=additions,catalog_count=len(remote))
            else: report.update(status='no eligible additions',catalog_count=len(original))
            # Reconcile only exact source/SKU matches, preserving all historical identity fields.
            if report['published']:
              for filename in ('cumulative-master.csv','pilot-leads.csv'):
                f=root/filename
                if not f.exists(): continue
                with f.open(encoding='utf-8-sig',newline='') as inp:
                  reader=csv.DictReader(inp);fields=reader.fieldnames;records=list(reader)
                for row in records:
                  for entry in additions:
                    if row['Manufacturer'].casefold()==entry['manufacturer'].casefold() and row['Product Code'].casefold()==entry['productCode'].casefold() and row['Source URL'] in (entry['sourceUrl'],entry.get('verificationSource')):
                      row['GitHub Status']='ALREADY IN GITHUB';row['GitHub Model ID']=entry['id'];row['Verification']=entry['verification']
                temp=f.with_suffix('.tmp')
                with temp.open('w',encoding='utf-8',newline='') as out:
                  writer=csv.DictWriter(out,fieldnames=fields);writer.writeheader();writer.writerows(records)
                temp.replace(f)
          except Exception as e:
            report['status']='deferred or uncertain; do not retry blindly'
            report['error']=str(e)
          finally:
            (root/'publication-result.json').write_text(json.dumps(report,indent=2))
            print(json.dumps(report))
          PY
      - name: Persist research checkpoint
        if: always()
        run: |
          test -s research/cumulative-master.csv
          python - <<'PY'
          import csv, pathlib, subprocess, io
          p=pathlib.Path('research/cumulative-master.csv')
          with p.open(encoding='utf-8-sig',newline='') as f:
            reader=csv.DictReader(f)
            keys=('Manufacturer','Product Code','Model Name','Color/Variant','Source URL')
            assert set(keys)<=set(reader.fieldnames or [])
            rows=list(reader)
          assert rows and all(None not in r for r in rows)
          old=subprocess.run(['git','show','refs/remotes/origin/turbo164-research-state:research/cumulative-master.csv'],capture_output=True,text=True)
          if old.returncode==0:
            previous=list(csv.DictReader(io.StringIO(old.stdout)))
            identity=lambda r: tuple(r.get(k,'') for k in keys)
            assert {identity(r) for r in previous}<={identity(r) for r in rows}, 'Historical records would be lost'
          print('Checkpoint validation passed:',len(rows))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tmp=$(mktemp -d)
          cp -a research "$tmp/"
          if git fetch origin refs/heads/turbo164-research-state; then
            git worktree add --detach "$tmp/state" FETCH_HEAD
          else
            git worktree add --detach "$tmp/state" HEAD
            git -C "$tmp/state" switch --orphan research-state-init
          fi
          mkdir -p "$tmp/state/research"
          cp -a "$tmp/research/." "$tmp/state/research/"
          git -C "$tmp/state" add -f research
          if ! git -C "$tmp/state" diff --cached --quiet; then
            git -C "$tmp/state" commit -m 'Turbo164: persist research checkpoint'
