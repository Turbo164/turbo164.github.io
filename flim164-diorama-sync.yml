name: Refresh FLIM164 dioramas

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flim164-catalog-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read and validate the partner catalog
        run: python3 scripts/sync-flim164.py
      - name: Publish changed catalog
        run: |
          if git diff --quiet -- diorama-catalog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diorama-catalog.json
          git commit -m "Refresh FLIM164 diorama catalog"
          git push origin HEAD:main
